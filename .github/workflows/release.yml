name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check that the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the versioning rule
        run: node scripts/check-version.mjs --release

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and bundle
        run: npm run compile

      - name: Extension host smoke test
        run: xvfb-run -a npm run test:smoke

      - name: Package the extension
        run: npm run package

      - name: Write the release notes from the changelog
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.vsix \
            --title "CodingView $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
