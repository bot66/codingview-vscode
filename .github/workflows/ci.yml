name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `npm run check:version` compares the manifest against every released tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the versioning rule
        run: npm run check:version

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check and bundle
        run: npm run compile

      - name: Extension host smoke test
        run: xvfb-run -a npm run test:smoke

      - name: Package the extension
        run: npm run package

      - name: Upload the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: codingview-vsix
          path: '*.vsix'
          if-no-files-found: error
